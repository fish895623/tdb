[package]
name = "tdb"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An embedded, file-based database engine"
publish = false

[features]
# Logging setup for the bundled programs; the library only uses the `log` facade.
default = ["cli"]
cli = ["dep:env_logger"]

[dependencies]
log = "0.4"
env_logger = { version = "0.11", optional = true }

[dev-dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v7"] }

[[bin]]
name = "tdbd"
required-features = ["cli"]

[[test]]
name = "smoke"
required-features = ["cli"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
