[workspace]
resolver = "3"
members = [
    "crates/tdb-core",
    "crates/tdb-config",
    "crates/tdb-lexer",
    "crates/tdb-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
tdb-core = { path = "crates/tdb-core" }
tdb-config = { path = "crates/tdb-config" }
tdb-lexer = { path = "crates/tdb-lexer" }

log = "0.4"
logos = "0.16"
serde = { version = "1", features = ["derive"] }
toml = "1"
env_logger = "0.11"
anyhow = "1"
tempfile = "3"
uuid = { version = "1", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
